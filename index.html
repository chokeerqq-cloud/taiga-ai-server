<!DOCTYPE html>
<html lang="ru" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#121212">
<title>Taiga AI</title>
<link rel="manifest" href="manifest.json">
<style>
  :root {
    color-scheme: dark;
    --bg: #121212;
    --panel: #1e1e1e;
    --panel-2: #2a2a2a;
    --text: #e0e0e0;
    --muted: #9a9a9a;
    --accent: #3b82f6;
    --user: #2563eb;
    --ai: #2a2a2a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    height: 100%;
  }
  body {
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: var(--panel);
    border-bottom: 1px solid #000;
    flex-shrink: 0;
  }
  header h1 { font-size: 18px; margin: 0; }
  header .voice-wrap {
    display: flex; align-items: center; gap: 6px;
  }
  header select {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid #444;
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 12px;
    max-width: 150px;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 85%;
    padding: 10px 12px;
    border-radius: 14px;
    line-height: 1.4;
    font-size: 15px;
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.ai {
    align-self: flex-start;
    background: var(--ai);
    border-bottom-left-radius: 4px;
  }
  .msg img {
    display: block;
    max-width: 100%;
    border-radius: 10px;
    margin-bottom: 6px;
  }
  .msg .speak {
    display: inline-block;
    margin-top: 6px;
    font-size: 11px;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
  }
  .msg .speak:hover { color: var(--accent); }
  #preview {
    display: none;
    padding: 8px 12px 0;
    background: var(--panel);
  }
  #preview.show { display: block; }
  #preview .thumb-wrap {
    position: relative;
    display: inline-block;
  }
  #preview img {
    height: 70px;
    border-radius: 8px;
    border: 1px solid #444;
  }
  #preview .remove {
    position: absolute;
    top: -6px; right: -6px;
    background: #e11d48;
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 20px; height: 20px;
    font-size: 12px;
    cursor: pointer;
  }
  footer {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: var(--panel);
    border-top: 1px solid #000;
    flex-shrink: 0;
  }
  footer .icon-btn {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid #444;
    border-radius: 10px;
    width: 44px; height: 44px;
    font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  #input {
    flex: 1;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid #444;
    border-radius: 12px;
    padding: 12px;
    font-size: 15px;
    resize: none;
    max-height: 120px;
    min-height: 44px;
    font-family: inherit;
  }
  #send {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 0 18px;
    height: 44px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
  }
  #send:disabled { opacity: 0.5; cursor: default; }
  #file { display: none; }
  .typing { color: var(--muted); font-style: italic; }
</style>
</head>
<body>

<header>
  <h1>Taiga AI</h1>
  <div class="voice-wrap">
    <select id="voiceSelect" title="Голос"></select>
    <button class="icon-btn" id="stopSpeak" title="Стоп" style="width:34px;height:34px;font-size:14px;">■</button>
  </div>
</header>

<div id="chat"></div>

<div id="preview">
  <div class="thumb-wrap">
    <img id="previewImg" alt="preview">
    <button class="remove" id="removeImg" title="Удалить">×</button>
  </div>
</div>

<footer>
  <button class="icon-btn" id="attach" title="Прикрепить картинку">📷</button>
  <input type="file" id="file" accept="image/*">
  <textarea id="input" rows="1" placeholder="Напиши сообщение..."></textarea>
  <button id="send">➤</button>
</footer>

<script>
(function () {
  "use strict";

  // ==== НАСТРОЙКА: адрес вашего сервера на Render ====
  // Сервер должен принимать POST /chat с JSON {message, image}
  var SERVER_URL = "https://taiga-ai-server-1.onrender.com/chat";

  var chatEl = document.getElementById("chat");
  var inputEl = document.getElementById("input");
  var sendBtn = document.getElementById("send");
  var attachBtn = document.getElementById("attach");
  var fileEl = document.getElementById("file");
  var previewEl = document.getElementById("preview");
  var previewImg = document.getElementById("previewImg");
  var removeImgBtn = document.getElementById("removeImg");
  var voiceSelect = document.getElementById("voiceSelect");
  var stopSpeakBtn = document.getElementById("stopSpeak");

  var pendingImage = null; // {dataUrl, base64}
  var history = [];        // {role, content} для контекста
  var busy = false;

  // ---------- Голоса ----------
  var synth = window.speechSynthesis;
  function loadVoices() {
    if (!synth) return;
    var voices = synth.getVoices();
    voiceSelect.innerHTML = "";
    if (!voices.length) {
      var opt = document.createElement("option");
      opt.textContent = "Голоса не найдены";
      voiceSelect.appendChild(opt);
      return;
    }
    voices.forEach(function (v, i) {
      var o = document.createElement("option");
      o.value = i;
      o.textContent = v.name + " (" + v.lang + ")";
      voiceSelect.appendChild(o);
    });
    // предпочесть русский голос
    var ruIdx = voices.findIndex(function (v) { return v.lang && v.lang.toLowerCase().indexOf("ru") === 0; });
    if (ruIdx >= 0) voiceSelect.value = ruIdx;
  }
  if (synth) {
    synth.onvoiceschanged = loadVoices;
    loadVoices();
  }
  stopSpeakBtn.addEventListener("click", function () {
    if (synth) synth.cancel();
  });

  function speak(text) {
    if (!synth || !text) return;
    synth.cancel();
    var u = new SpeechSynthesisUtterance(text);
    var voices = synth.getVoices();
    var idx = parseInt(voiceSelect.value, 10);
    if (voices[idx]) { u.voice = voices[idx]; u.lang = voices[idx].lang; }
    u.rate = 1; u.pitch = 1;
    synth.speak(u);
  }

  // ---------- UI: сообщения ----------
  function addMessage(role, text, imageDataUrl) {
    var div = document.createElement("div");
    div.className = "msg " + role;
    if (imageDataUrl) {
      var img = document.createElement("img");
      img.src = imageDataUrl;
      div.appendChild(img);
    }
    if (text) {
      var span = document.createElement("span");
      span.textContent = text;
      div.appendChild(span);
    }
    if (role === "ai" && text) {
      var sp = document.createElement("span");
      sp.className = "speak";
      sp.textContent = "🔊 озвучить";
      sp.addEventListener("click", function () { speak(text); });
      div.appendChild(sp);
    }
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }

  function addTyping() {
    var d = document.createElement("div");
    d.className = "msg ai typing";
    d.textContent = "Тайга печатает…";
    chatEl.appendChild(d);
    chatEl.scrollTop = chatEl.scrollHeight;
    return d;
  }

  // ---------- Картинка ----------
  attachBtn.addEventListener("click", function () { fileEl.click(); });
  fileEl.addEventListener("change", function () {
    var f = fileEl.files && fileEl.files[0];
    if (!f) return;
    if (!f.type.startsWith("image/")) { alert("Нужна картинка"); return; }
    if (f.size > 5 * 1024 * 1024) { alert("Максимум 5 МБ"); return; }
    var reader = new FileReader();
    reader.onload = function (e) {
      var dataUrl = e.target.result;
      pendingImage = { dataUrl: dataUrl, base64: dataUrl.split(",")[1] };
      previewImg.src = dataUrl;
      previewEl.classList.add("show");
    };
    reader.readAsDataURL(f);
    fileEl.value = "";
  });
  removeImgBtn.addEventListener("click", function () {
    pendingImage = null;
    previewEl.classList.remove("show");
    previewImg.src = "";
  });

  // ---------- Отправка ----------
  function setBusy(v) {
    busy = v;
    sendBtn.disabled = v;
    inputEl.disabled = v;
    attachBtn.disabled = v;
  }

  async function sendMessage() {
    if (busy) return;
    var text = inputEl.value.trim();
    if (!text && !pendingImage) return;

    var imgForMsg = pendingImage ? pendingImage.dataUrl : null;
    addMessage("user", text, imgForMsg);

    history.push({
      role: "user",
      content: text || "[картинка]"
    });

    var payload = {
      message: text,
      image: pendingImage ? pendingImage.base64 : null,
      history: history.slice(-10)
    };

    inputEl.value = "";
    inputEl.style.height = "auto";
    pendingImage = null;
    previewEl.classList.remove("show");
    previewImg.src = "";

    setBusy(true);
    var typing = addTyping();

    try {
      var res = await fetch(SERVER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      var data = await res.json();
      var reply = data.reply || data.message || data.content || "";
      typing.remove();
      if (!reply) reply = "Пустой ответ от сервера.";
      addMessage("ai", reply);
      history.push({ role: "assistant", content: reply });
      speak(reply);
    } catch (err) {
      typing.remove();
      addMessage("ai", "Ошибка связи с сервером: " + err.message);
    } finally {
      setBusy(false);
      inputEl.focus();
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  inputEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  inputEl.addEventListener("input", function () {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
  });
})();
</script>
</body>
</html>
